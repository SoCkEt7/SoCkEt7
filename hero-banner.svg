<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="100%" height="250">
  <defs>
    <radialGradient id="subtleGlow" cx="12%" cy="57%" r="60%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#060911" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fineLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#6d28d9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2"/>
    </linearGradient>

    <!-- ORIGINAL HYDRA MONOLITH GRADIENTS -->
    <linearGradient id="g-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="g-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="g-left" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="g-inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>

    <style>
      @keyframes hydra-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
      @keyframes hydra-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      @keyframes hydra-faces { 
        0%, 20% { opacity: 0.95; }    
        45%, 55% { opacity: 0.25; }   
        80%, 100% { opacity: 0.95; }  
      }
      @keyframes hydra-core-glow { 
        0%, 20% { opacity: 0.6; }   
        45%, 55% { opacity: 1; }    
        80%, 100% { opacity: 0.6; } 
      }
      @keyframes hydra-edges {
        0%, 20% { opacity: 0.8; }
        45%, 55% { opacity: 0.2; }
        80%, 100% { opacity: 0.8; }
      }
      @keyframes pulse-status { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

      .hydra-root { transform-origin: 75px 70px; animation: hydra-breathe 8s cubic-bezier(0.4, 0, 0.2, 1) infinite, hydra-float 6s ease-in-out infinite; }
      .face-shift { animation: hydra-faces 8s ease-in-out infinite; }
      .core-shift { transform-origin: 75px 70px; animation: hydra-core-glow 8s ease-in-out infinite; }
      .edge-shift { animation: hydra-edges 8s ease-in-out infinite; }
      .status-pulse { animation: pulse-status 2.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Clean dark base -->
  <rect width="960" height="250" rx="8" fill="#070a12"/>
  <rect width="960" height="250" rx="8" fill="url(#subtleGlow)"/>
  <rect x="0.5" y="0.5" width="959" height="249" rx="7.5" fill="none" stroke="#172033" stroke-width="1"/>

  <!-- Top Metadata Bar -->
  <g transform="translate(36, 26)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" fill="#64748b">
    <circle cx="4" cy="4" r="3" fill="#a855f7" class="status-pulse"/>
    <text x="16" y="7" font-weight="500" fill="#94a3b8">hydra ecosystem</text>
    <text x="120" y="7" fill="#334155">/</text>
    <text x="134" y="7" fill="#64748b">node <tspan fill="#e2e8f0" font-weight="600">socket7</tspan></text>
    <text x="215" y="7" fill="#334155">/</text>
    <text x="229" y="7" fill="#64748b">paris, france</text>
    <text x="310" y="7" fill="#334155">/</text>
    <text x="324" y="7" fill="#38bdf8" font-weight="500">nis2 · ptes · zero-trust</text>
  </g>

  <!-- Left: EQUIDISTANT & PERFECTLY CENTERED Hydra Monolith Logo -->
  <g transform="translate(-42, 5) scale(1.95)">
    <g class="hydra-root">
      <!-- 3D Faces in Original Monolith Colors -->
      <g class="face-shift">
        <path d="M75,36 L105,53 L75,70 L45,53 Z" fill="url(#g-top)"/>
        <path d="M105,53 L105,87 L75,104 L75,70 Z" fill="url(#g-right)"/>
        <path d="M45,53 L75,70 L75,104 L45,87 Z" fill="url(#g-left)"/>
      </g>

      <!-- Internal Y Edges -->
      <g class="edge-shift" stroke="#38bdf8" stroke-width="1.1" stroke-linecap="round">
        <path d="M75,70 L75,104 M75,70 L105,53 M75,70 L45,53" />
      </g>

      <!-- Outer Hexagon Perimeter -->
      <path d="M75,36 L105,53 L105,87 L75,104 L45,87 L45,53 Z" fill="none" stroke="#38bdf8" stroke-width="1.3" stroke-linejoin="round"/>

      <!-- Animated Tesseract Core (Perfect Center at 75, 70) -->
      <g class="core-shift">
        <path fill="url(#g-inner)" stroke="#ffffff" stroke-width="0.85" stroke-linejoin="round">
          <animate attributeName="d" values="M75,56 L86,63 L86,77 L75,84 L64,77 L64,63 Z; M75,50 L90,59 L90,81 L75,90 L60,81 L60,59 Z; M75,56 L86,63 L86,77 L75,84 L64,77 L64,63 Z" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
        </path>
        
        <!-- Core internal Y edges -->
        <path fill="none" stroke="#ffffff" opacity="0.95" stroke-linecap="round" stroke-width="0.75">
          <animate attributeName="d" values="M75,70 L75,84 M75,70 L86,63 M75,70 L64,63; M75,70 L75,90 M75,70 L90,59 M75,70 L60,59; M75,70 L75,84 M75,70 L86,63 M75,70 L64,63" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
        </path>

        <!-- 4D Connector Rays -->
        <g stroke="#7dd3fc" opacity="0.85" stroke-width="0.7" stroke-dasharray="2,2">
          <line x1="75" y1="36" x2="75" y2="56"><animate attributeName="y2" values="56;50;56" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/></line>
          <line x1="105" y1="53" x2="86" y2="63"><animate attributeName="x2" values="86;90;86" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/><animate attributeName="y2" values="63;59;63" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/></line>
          <line x1="105" y1="87" x2="86" y2="77"><animate attributeName="x2" values="86;90;86" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/><animate attributeName="y2" values="77;81;77" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/></line>
          <line x1="45" y1="53" x2="64" y2="63"><animate attributeName="x2" values="64;60;64" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/><animate attributeName="y2" values="63;59;63" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/></line>
          <line x1="45" y1="87" x2="64" y2="77"><animate attributeName="x2" values="64;60;64" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/><animate attributeName="y2" values="77;81;77" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/></line>
          <line x1="75" y1="104" x2="75" y2="84"><animate attributeName="y2" values="84;90;84" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/></line>
        </g>
      </g>
    </g>
  </g>

  <!-- Middle: Identity & Focus -->
  <g transform="translate(225, 74)">
    <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#38bdf8" letter-spacing="0.5">
      Critical Infrastructure Cybersecurity · Adversarial AI Defense R&amp;D
    </text>
    
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="34" font-weight="600" fill="#f8fafc" letter-spacing="-0.5">
      Antonin Nivoche
    </text>

    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
      Ex-CTO (18+ yrs) · Sorbonne University · Sovereign Systems &amp; AI Defense
    </text>

    <!-- Subtle capability pills -->
    <g transform="translate(0, 106)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10.5">
      <rect x="0" y="0" width="124" height="24" rx="4" fill="#0b1322" stroke="#1e293b" stroke-width="0.8"/>
      <text x="12" y="16" fill="#7dd3fc" font-weight="500">Offensive AI &amp; MCP</text>

      <rect x="132" y="0" width="108" height="24" rx="4" fill="#0b1322" stroke="#1e293b" stroke-width="0.8"/>
      <text x="12" y="16" fill="#38bdf8" font-weight="500" transform="translate(132, 0)">Fractional CTO</text>

      <rect x="248" y="0" width="138" height="24" rx="4" fill="#130e22" stroke="#3b1d5c" stroke-width="0.8"/>
      <text x="12" y="16" fill="#c084fc" font-weight="500" transform="translate(248, 0)">Rust &amp; Systems Core</text>
    </g>
  </g>

  <!-- Right: Quiet Metrics Panel -->
  <g transform="translate(696, 56)">
    <rect x="0" y="0" width="228" height="154" rx="6" fill="#090d18" stroke="#172033" stroke-width="0.8"/>
    
    <g transform="translate(18, 24)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="500" fill="#64748b">Verified activity</text>
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="24" font-weight="600" fill="#f8fafc">5,713+</text>
      <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" fill="#94a3b8">total commits</text>
    </g>

    <g transform="translate(122, 24)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="500" fill="#64748b">Flagship tool</text>
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="24" font-weight="600" fill="#38bdf8">230★</text>
      <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" fill="#94a3b8">Livediff (Rust)</text>
    </g>

    <line x1="18" y1="88" x2="210" y2="88" stroke="#172033" stroke-width="0.8"/>

    <g transform="translate(18, 110)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9.5" fill="#64748b">
      <text x="0" y="0">110 private repos sanitized</text>
      <text x="0" y="16">Advisory SLA &lt; 24h · Nyxia</text>
    </g>
  </g>

  <!-- Fine bottom laser line -->
  <rect x="0" y="249" width="960" height="1" fill="url(#fineLine)"/>
</svg>
